# HTTP to HTTPS redirect
server {
    listen 80;
    server_name debate-arena.duckdns.org;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name debate-arena.duckdns.org;
    root /usr/share/nginx/html;
    index index.html;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/debate-arena.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/debate-arena.duckdns.org/privkey.pem;
    
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip 압축 활성화
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 보안 헤더 (HTTPS 전용)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 정적 파일 캐싱 (개발용으로 짧게)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Vue.js SPA를 위한 히스토리 모드 설정
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 (개발 백엔드 서버)
    location /api {
        proxy_pass http://3.34.95.4:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # WebSocket 프록시 (개발용)
    location /ws {
        proxy_pass http://3.34.95.4:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # 개발용 디버깅 정보
    location /debug {
        return 200 "개발 서버 정상 동작 중 (HTTPS)\n서버: debate-arena.duckdns.org\n시간: $time_iso8601\n";
        add_header Content-Type text/plain;
    }
} 