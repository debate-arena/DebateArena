services:
  # MySQL 데이터베이스
  mysql:
    image: mysql:8.0.43
    container_name: debate-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ssafy
      MYSQL_DATABASE: debate_arena
      MYSQL_USER: root
      MYSQL_PASSWORD: ssafy
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - debate-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # Redis 캐시 서버
  redis:
    image: redis:8.0.3
    container_name: debate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - debate-network
    command: redis-server --appendonly yes --requirepass redispass
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

networks:
  debate-network:
    external: true