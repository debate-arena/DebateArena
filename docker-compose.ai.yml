services:
  ai-server:
    build: ./AI/AI_server
    container_name: ai-server
    env_file:
      - ./AI/AI_server/.env
    environment:
      ROOT_PATH: /api/ai
      UVICORN_PORT: 8000
      UVICORN_HOST: 0.0.0.0
    expose:
      - "8000"     # reverse-proxy 컨테이너에서만 접근하면 expose로 충분
    networks:
      - debate-network
networks:
  debate-network:
    external: true

volumes:
  ai-chroma:
