services:
  # Debate Arena 서비스 (OAuth2, JWT 인증)
  debate-arena:
    build:
      context: ./debate-arena
      dockerfile: Dockerfile
    container_name: debate-arena
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/debate_arena?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: debate_user
      SPRING_DATASOURCE_PASSWORD: debate_pass
      SPRING_REDIS_HOST: host.docker.internal
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redispass
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - debate-network
    restart: unless-stopped

  # Matching 서비스 (WebSocket 매칭)
  matching:
    build:
      context: ./matching
      dockerfile: Dockerfile
    container_name: matching
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/debate_arena?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: debate_user
      SPRING_DATASOURCE_PASSWORD: debate_pass
      SPRING_REDIS_HOST: host.docker.internal
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redispass
      DEBATE_SERVER_URL: http://debate:8082
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - debate-arena
    networks:
      - debate-network
    restart: unless-stopped

  # Debate 서비스 (토론방 관리)
  debate:
    build:
      context: ./debate
      dockerfile: Dockerfile
    container_name: debate
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/debate_arena?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: debate_user
      SPRING_DATASOURCE_PASSWORD: debate_pass
      SPRING_REDIS_HOST: host.docker.internal
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redispass
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - matching
    networks:
      - debate-network
    restart: unless-stopped

  # React Frontend (선택사항)
  frontend:
    image: node:18-alpine
    container_name: debate-frontend
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: >
      sh -c "npm install && npm start"
    environment:
      - REACT_APP_DEBATE_ARENA_URL=http://localhost:8080
      - REACT_APP_MATCHING_URL=http://localhost:8081
      - REACT_APP_DEBATE_URL=http://localhost:8082
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - debate-arena
      - matching
      - debate
    networks:
      - debate-network
    restart: unless-stopped

networks:
  debate-network:
    driver: bridge
    external: true